<!DOCTYPE html>
<html lang="ar"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاكي فيجوال بيزك</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#d4d0c8;font:12px Tahoma,"Segoe UI",Arial,sans-serif;color:#000;display:flex;flex-direction:column;min-width:1000px;min-height:600px;user-select:none;overflow:auto}
#top{background:linear-gradient(90deg,#0a246a,#a6caf0);color:#fff;font-weight:bold;padding:3px 8px}
#menu{display:flex;gap:2px;padding:1px 4px;position:relative;z-index:50}
.mi{position:relative;padding:3px 8px}.mi:hover,.mi.o{background:#0a246a;color:#fff}
.dd{display:none;position:absolute;left:0;top:100%;background:#d4d0c8;color:#000;min-width:230px;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:2px}
.mi.o .dd{display:block}.dd div{padding:4px 18px}.dd div:hover{background:#0a246a;color:#fff}.dd hr{margin:2px 0}
#tb{display:flex;gap:2px;padding:2px 4px;border-top:1px solid #fff;border-bottom:1px solid #808080;align-items:center}
.tbtn{font:12px Tahoma,Arial;padding:3px 8px;background:#d4d0c8;border:2px solid;border-color:#fff #808080 #808080 #fff;cursor:pointer;color:#000}
.tbtn:active{border-color:#808080 #fff #fff #808080}
.sep{width:2px;height:20px;border-left:1px solid #808080;border-right:1px solid #fff;margin:0 4px}
#main{flex:1;display:flex;min-height:0;gap:3px;padding:3px}
.pn{background:#d4d0c8;border:2px solid;border-color:#fff #808080 #808080 #fff;display:flex;flex-direction:column;min-height:0}
.pt{background:#0a246a;color:#fff;padding:1px 4px;font-size:11px}
.bd{background:#fff;overflow:auto;flex:1;margin:2px;border:1px solid #808080}
#tx{display:grid;grid-template-columns:32px 32px;gap:2px;padding:4px;align-content:start}
.tl{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2px solid;border-color:#fff #808080 #808080 #fff;cursor:pointer;font-size:13px}
.tl.on{border-color:#808080 #fff #fff #808080;background:#eee}
#cen{flex:1;background:#808080;overflow:auto;padding:12px;min-width:0;display:flex;flex-direction:column;border:2px solid;border-color:#808080 #fff #fff #808080}
#formwin{align-self:flex-start;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:3px}
.tbar{background:linear-gradient(90deg,#0a246a,#a6caf0);color:#fff;font-weight:bold;padding:2px 6px}
#form{position:relative;overflow:hidden;margin-top:3px;border:1px solid #404040}
.design #form,.fm{background-image:radial-gradient(#000 .7px,transparent .8px);background-size:8px 8px}
.c{position:absolute;z-index:1;display:flex}
.c>*:not(.h){flex:1;min-width:0;font:inherit;color:inherit}
.design .c>*:not(.h){pointer-events:none}.design .c{cursor:move}
.c.sel{outline:1px dashed #000}
.h{position:absolute;width:7px;height:7px;background:#000;z-index:5}
.lb{white-space:pre-wrap;align-self:flex-start;padding:2px}
.c input:not([type]),.c select{border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;font:inherit;padding:1px 3px;color:#000}
.c button{border:2px solid;border-color:#fff #404040 #404040 #fff;background:inherit;font:inherit;color:inherit}
.c label{display:flex;align-items:center;gap:4px}.c label input{flex:none}
.c fieldset{border:1px solid #808080;margin:0;padding:0 4px}
.ls{background:#fff;color:#000;border:2px solid;border-color:#808080 #fff #fff #808080;overflow:auto}
.ls div{padding:0 3px}.ls div.on{background:#0a246a;color:#fff}
.rub{position:absolute;border:1px dashed #000;z-index:9}
#pr{position:absolute;left:4px;top:4px;white-space:pre;pointer-events:none;z-index:0}
#codewin{display:none;flex:1;flex-direction:column;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:3px;min-height:380px}
#code{flex:1;border:2px solid;border-color:#808080 #fff #fff #808080;font:14px Consolas,"Courier New",monospace;white-space:pre;tab-size:4;resize:none;direction:ltr;user-select:text;outline:0;margin-top:2px}
#rt{width:230px;display:flex;flex-direction:column;gap:3px}
#pg table{width:100%;border-collapse:collapse}
#pg td{border:1px solid #d4d0c8;padding:0 3px;height:20px;white-space:nowrap}
#pg td input,#pg td select{width:100%;border:0;font:inherit;padding:0;background:transparent;user-select:text;color:#000}
#pg td:first-child{width:80px;background:#f4f4f4}
.scr{margin:6px auto;width:128px;height:96px;background:#008080;border:2px solid #404040;position:relative}
#lf{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#d4d0c8;border:1px solid #000}
#st{padding:2px 8px;border-top:1px solid #808080}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:99}
.dl{background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;min-width:300px;max-width:520px;padding:3px}
.db{padding:14px;display:flex;gap:12px;align-items:flex-start;user-select:text;white-space:pre-wrap}
.dl input{user-select:text}.bt{display:flex;gap:8px;justify-content:center;padding:6px}.bt button{min-width:72px}.ic{font-size:26px}
#sheet{display:none}
#sheet h2{text-align:center;margin:0 0 8px}#sheet h3{margin:14px 0 6px}
#sheet .meta{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding:6px 0}
#sheet table{border-collapse:collapse;width:100%}#sheet td,#sheet th{border:1px solid #000;padding:3px 6px;text-align:center;font-size:12px}
#sheet pre{direction:ltr;text-align:left;border:1px solid #888;padding:8px;font:12px Consolas,monospace;white-space:pre-wrap}
.wt{display:inline-block;border:2px solid #000;background:#d4d0c8}
@media print{body>*:not(#sheet){display:none!important}html,body{height:auto;overflow:visible;min-width:0}
#sheet{display:block;direction:rtl;font:14px Arial,sans-serif;background:#fff;color:#000;padding:8mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head>
<body class="design">
<div id="top">Project1 - Visual Basic Simulator <span id="mode">[design]</span> · محاكي فيجوال بيزك</div>
<div id="menu"></div><div id="tb"></div>
<div id="main">
 <div class="pn" style="width:80px"><div class="pt">Toolbox</div><div id="tx"></div></div>
 <div id="cen">
  <div id="formwin"><div class="tbar" id="ftitle"></div><div id="form"><div id="pr"></div></div></div>

 </div>

 </div>
</div>
<div id="st"></div><div id="sheet"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T={label:{p:"Label",w:88,h:24},text:{p:"Text",w:112,h:24},button:{p:"Command",w:96,h:32},check:{p:"Check",w:104,h:24},option:{p:"Option",w:104,h:24},frame:{p:"Frame",w:160,h:104},list:{p:"List",w:112,h:88},combo:{p:"Combo",w:112,h:24}};
const TN={label:"Label",text:"TextBox",button:"CommandButton",check:"CheckBox",option:"OptionButton",frame:"Frame",list:"ListBox",combo:"ComboBox"};
const EV={form:["Load","Click","DblClick"],label:["Click","DblClick"],text:["Change","Click"],button:["Click"],check:["Click"],option:["Click"],frame:["Click"],list:["Click","DblClick"],combo:["Click","Change"]};
const TOOLS=[["","↖","Pointer"],["label","A","Label"],["text","ab","TextBox"],["button","▭","CommandButton"],["check","☑","CheckBox"],["option","◉","OptionButton"],["frame","▢","Frame"],["list","☰","ListBox"],["combo","▾","ComboBox"]];
let M,sel,tool=null,running=false,snap,P,cnt={},last={};
const F=$("#form"),PR=$("#pr"),sn=v=>Math.round(v/8)*8,elOf=c=>F.querySelector(`[data-n="${c.name}"]`);

function dlg(t,h,b){return new Promise(r=>{const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class=dl><div class=tbar>${esc(t)}</div><div class=db>${h}</div><div class=bt>${b.map((x,i)=>`<button class=tbtn data-i=${i}>${x}</button>`).join("")}</div></div>`;document.body.append(o);o.onclick=e=>{const k=e.target.closest("button");if(k){o.remove();r({i:+k.dataset.i,o})}};o.onkeydown=e=>{if(e.key=="Enter")o.querySelector("button").click()};(o.querySelector("input")||o.querySelector("button")).focus()})}
function drag(e,fn,done){const sx=e.clientX,sy=e.clientY,mv=ev=>fn(ev.clientX-sx,ev.clientY-sy),up=()=>{removeEventListener("mousemove",mv);removeEventListener("mouseup",up);done&&done()};addEventListener("mousemove",mv);addEventListener("mouseup",up);e.preventDefault()}

/* ---------- model / design surface ---------- */
function newP(){M={form:{name:"Form1",caption:"Form1",backcolor:"#f0f0f0",width:480,height:320},ctrls:[],code:""};cnt={};$("#code").value="";sel="form";fmt();draw();props();showView("obj")}
function fmt(){const f=M.form;Object.assign(F.style,{width:f.width+"px",height:f.height+"px",backgroundColor:f.backcolor});$("#ftitle").textContent=f.caption;$("#lf").style.cssText=`width:${Math.min(100,f.width/10.24)}%;height:${Math.min(100,f.height/7.68)}%`}
function add(t,x,y,w,h,o){const k=T[t];cnt[t]=(cnt[t]||0)+1;const n=k.p+cnt[t];
 const c={type:t,name:n,left:Math.max(0,x),top:Math.max(0,y),width:w||k.w,height:h||k.h,backcolor:["text","list","combo"].includes(t)?"#ffffff":t=="button"?"#d4d0c8":"",forecolor:"#000000",fontsize:13,enabled:true,visible:true};
 if(["label","button","check","option","frame"].includes(t))c.caption=n;
 if(t=="text"||t=="combo")c.text=n;if(t=="check")c.value=0;if(t=="option")c.value=false;if(t=="list"||t=="combo"){c.items=[];c.sel=-1}
 Object.assign(c,o);M.ctrls.push(c);select(c);return c}
function mk(c){const d=document.createElement("div"),t=c.type,n=esc(c.caption),dis=c.enabled?"":" disabled";d.className="c";d.dataset.n=c.name;
 const s=d.style;Object.assign(s,{left:c.left+"px",top:c.top+"px",width:c.width+"px",height:c.height+"px",color:c.forecolor,fontSize:c.fontsize+"px",zIndex:t=="frame"?0:1});if(c.backcolor)s.background=c.backcolor;
 if(!c.visible){running?s.display="none":s.opacity=.45}
 d.innerHTML=t=="label"?`<span class=lb>${n}</span>`:t=="text"?`<input value="${esc(c.text)}"${dis}>`:t=="button"?`<button${dis}>${n}</button>`
 :t=="check"?`<label><input type=checkbox${c.value==1?" checked":""}${dis}>${n}</label>`:t=="option"?`<label><input type=radio name=o${c.value?" checked":""}${dis}>${n}</label>`
 :t=="frame"?`<fieldset><legend>${n}</legend></fieldset>`:t=="list"?`<div class=ls>${c.items.map((x,i)=>`<div class="${i==c.sel?"on":""}" data-i=${i}>${esc(x)}</div>`).join("")}</div>`
 :`<select${dis}>${c.items.includes(c.text)?"":`<option selected>${esc(c.text)}</option>`}${c.items.map(x=>`<option${x==c.text?" selected":""}>${esc(x)}</option>`).join("")}</select>`;
 if(!running&&sel===c){d.classList.add("sel");const L={nw:[0,0],n:[50,0],ne:[100,0],e:[100,50],se:[100,100],s:[50,100],sw:[0,100],w:[0,50]};for(const p in L){const h=document.createElement("i");h.className="h";h.dataset.p=p;h.style.cssText=`left:calc(${L[p][0]}% - 4px);top:calc(${L[p][1]}% - 4px);cursor:${p}-resize`;d.append(h)}}
 if(running){const nm=c.name.toLowerCase(),q=d.querySelector("input,select"),ev=e=>disp(nm+"_"+e);
  d.onclick=e=>{e.stopPropagation();if(["button","label","frame"].includes(t))ev("click");if(t=="list"){const i=e.target.dataset.i;if(i!=null){c.sel=+i;rd1(c);ev("click")}}};
  d.ondblclick=e=>{e.stopPropagation();ev("dblclick")};
  if(t=="text")q.oninput=()=>{c.text=q.value;ev("change")};
  if(t=="check")q.onchange=()=>{c.value=q.checked?1:0;ev("click")};
  if(t=="option")q.onchange=()=>{M.ctrls.forEach(o=>o.type=="option"&&(o.value=false));c.value=true;ev("click")};
  if(t=="combo")q.onchange=()=>{c.text=q.value;c.sel=c.items.indexOf(q.value);ev("click");ev("change")}}
 return d}
const rd1=c=>{const o=elOf(c);o&&o.replaceWith(mk(c))};
function draw(){[...F.children].forEach(x=>x!==PR&&x.remove());M.ctrls.forEach(c=>F.insertBefore(mk(c),PR));status()}
function place(c){const e=elOf(c);e&&Object.assign(e.style,{left:c.left+"px",top:c.top+"px",width:c.width+"px",height:c.height+"px"});status()}
function status(){$("#st").textContent=running?"Running... / قيد التشغيل":sel&&sel!="form"?`${sel.name}    Left: ${sel.left}   Top: ${sel.top}   Width: ${sel.width}   Height: ${sel.height}`:"Ready - اسحب الأدوات من Toolbox إلى الفورم، وانقر مرتين على الأداة لكتابة الكود"}
function select(x){sel=x;draw();props()}
function del(){if(running||!sel||sel=="form")return;M.ctrls=M.ctrls.filter(c=>c!==sel);select("form")}
function setTool(t){tool=t||null;document.querySelectorAll(".tl").forEach(b=>b.classList.toggle("on",(b.dataset.t||null)==tool));F.style.cursor=tool?"crosshair":""}
F.onmousedown=e=>{if(running)return;const h=e.target.closest(".h"),d=e.target.closest(".c");
 if(h){const c=sel,o={...c},p=h.dataset.p;drag(e,(dx,dy)=>{let l=o.left,t=o.top,w=o.width,hh=o.height;
  if(p.includes("e"))w=Math.max(8,sn(o.width+dx));if(p.includes("s"))hh=Math.max(8,sn(o.height+dy));
  if(p.includes("w")){w=Math.max(8,sn(o.width-dx));l=o.left+o.width-w}if(p.includes("n")){hh=Math.max(8,sn(o.height-dy));t=o.top+o.height-hh}
  Object.assign(c,{left:l,top:t,width:w,height:hh});place(c)},props);return}
 if(d){const c=M.ctrls.find(x=>x.name==d.dataset.n),now=Date.now();
  if(last.n==c.name&&now-last.t<400){last={};showCode();return}last={n:c.name,t:now};
  if(sel!==c)select(c);const l=c.left,t=c.top;drag(e,(dx,dy)=>{c.left=Math.max(0,sn(l+dx));c.top=Math.max(0,sn(t+dy));place(c)},props);return}
 if(tool)return rub(e);select("form")};
function rub(e){const r=F.getBoundingClientRect(),x0=sn(e.clientX-r.left),y0=sn(e.clientY-r.top),b=document.createElement("div");b.className="rub";F.append(b);let w=0,h=0;
 drag(e,(dx,dy)=>{w=sn(dx);h=sn(dy);Object.assign(b.style,{left:Math.min(x0,x0+w)+"px",top:Math.min(y0,y0+h)+"px",width:Math.abs(w)+"px",height:Math.abs(h)+"px"})},()=>{b.remove();const t=tool;add(t,Math.min(x0,x0+w),Math.min(y0,y0+h),Math.abs(w)<16?0:Math.abs(w),Math.abs(h)<16?0:Math.abs(h));setTool(null)})}
F.ondblclick=e=>{if(!running&&e.target===F)showCode("Form")};
F.onclick=()=>running&&disp("form_click");
F.ondragover=e=>e.preventDefault();
F.ondrop=e=>{e.preventDefault();const t=e.dataTransfer.getData("text");if(!T[t]||running)return;const r=F.getBoundingClientRect();add(t,sn(e.clientX-r.left),sn(e.clientY-r.top))};

/* ---------- properties ---------- */
function props(){const f=sel=="form"||!sel,c=f?M.form:sel;
 $("#os").innerHTML=[`<option${f?" selected":""}>${esc(M.form.name)} Form</option>`,...M.ctrls.map(x=>`<option${x===c?" selected":""}>${esc(x.name)} ${TN[x.type]}</option>`)].join("");
 const ks=f?["name","caption","backcolor","width","height"]:["name",...["caption","text","value","items"].filter(k=>c[k]!==undefined),"left","top","width","height","backcolor","forecolor","fontsize","enabled","visible"];
 $("#pg").innerHTML="<table>"+ks.map(k=>{let v=c[k],i;if(k=="items")v=v.join(",");const a=`data-k=${k}`,chk=k=="value"&&c.type=="check";
  i=/color/.test(k)?`<input type=color ${a} value="${v||"#f0f0f0"}">`:typeof v=="boolean"||chk?`<select ${a}>${(chk?[0,1]:["True","False"]).map(o=>`<option${(chk?v==o:String(v)==o.toLowerCase())?" selected":""}>${o}</option>`).join("")}</select>`:`<input ${a} value="${esc(v)}">`;
  return`<tr><td>${{name:"(Name)",backcolor:"BackColor",forecolor:"ForeColor",fontsize:"FontSize",items:"List"}[k]||k[0].toUpperCase()+k.slice(1)}</td><td>${i}</td></tr>`}).join("")+"</table>"}
$("#os").onchange=e=>{if(!running){const i=e.target.selectedIndex;select(i?M.ctrls[i-1]:"form")}};
$("#pg").onchange=e=>{const el=e.target,k=el.dataset.k;if(!k||running)return;let v=el.value;const f=sel=="form"||!sel,c=f?M.form:sel;
 if(k=="name"){if(!/^[A-Za-z_]\w*$/.test(v)||[M.form.name,...M.ctrls.map(o=>o.name)].some(n=>n.toLowerCase()==v.toLowerCase()&&n!==c.name)){dlg("Name","<div class=ic>⚠</div><div>اسم غير صالح أو مكرر / Invalid or duplicate name</div>",["OK"]);props();return}c.name=v}
 else if(["left","top","width","height","fontsize"].includes(k))c[k]=Math.max(k=="fontsize"?6:0,+v||0);
 else if(k=="enabled"||k=="visible")c[k]=v=="True";
 else if(k=="value")c.value=c.type=="check"?+v:v=="True";
 else if(k=="items"){c.items=v?v.split(","):[]}
 else c[k]=v;
 if(f)fmt();draw();props()};

/* ---------- code window ---------- */
function showView(v){$("#formwin").style.display=v=="obj"?"block":"none";$("#codewin").style.display=v=="code"?"flex":"none"}
const evList=o=>EV[o=="Form"?"form":(M.ctrls.find(x=>x.name==o)||{}).type]||[];
function fillCo(o,e){$("#co").innerHTML=["Form",...M.ctrls.map(c=>c.name)].map(n=>`<option value=${n}${n==o?" selected":""}>${n=="Form"?M.form.name:n}</option>`).join("");$("#cp").innerHTML=evList(o).map(x=>`<option${x==e?" selected":""}>${x}</option>`).join("")}
function showCode(o,e){if(running)return;if(!o)o=sel&&sel!="form"?sel.name:"Form";if(!e)e=evList(o)[0]||"Click";
 const ta=$("#code"),re=new RegExp("sub\\s+"+o+"_"+e+"\\s*\\(","i");
 if(!re.test(ta.value))ta.value+=(ta.value&&!/\n$/.test(ta.value)?"\n":"")+(ta.value?"\n":"")+`Private Sub ${o}_${e}()\n    \nEnd Sub\n`;
 M.code=ta.value;fillCo(o,e);showView("code");const i=ta.value.search(re),j=ta.value.indexOf("\n",i)+1,p=j+ta.value.slice(j).match(/^ */)[0].length;ta.focus();ta.setSelectionRange(p,p)}
$("#co").onchange=e=>showCode(e.target.value);$("#cp").onchange=e=>showCode($("#co").value,e.target.value);
$("#code").oninput=e=>M.code=e.target.value;
$("#code").onkeydown=e=>{if(e.key=="Tab"){e.preventDefault();e.target.setRangeText("    ",e.target.selectionStart,e.target.selectionEnd,"end");M.code=e.target.value}};

/* ---------- VB -> JS compiler ---------- */
const sp=(s,c)=>{let d=0,q=0,p=[],b="";for(const x of s){if(x=='"')q^=1;if(!q){if(x=="(")d++;if(x==")")d--}if(x==c&&!d&&!q){p.push(b);b=""}else b+=x}p.push(b);return p};
function compile(src,rt){
 const L=src.replace(/ _\r?\n/g," ").split(/\r?\n/),procs=new Set(["msgbox","inputbox"]),arrs=new Set(),evs=[],st=[];let cur=null,k=0;
 L.forEach(l=>{const m=l.match(/^\s*(?:(?:public|private|friend)\s+)?(?:sub|function)\s+(\w+)/i);if(m){procs.add(m[1].toLowerCase());evs.push(m[1].toLowerCase())}else if(/^\s*(dim|static|public|private|global)\s/i.test(l))l.replace(/(\w+)\s*\(\s*\d*\s*\)/g,(a,n)=>arrs.add(n.toLowerCase()))});
 const ex=s=>{const a=sp(s,"&");if(a.length>1)return a.map(x=>"fmtn("+ex(x)+")").join("+''+");
