<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاكي فيجوال بيسك</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#d4d0c8;font:12px Tahoma,"Segoe UI",Arial,sans-serif;color:#000;display:flex;flex-direction:column;min-height:600px;user-select:none;overflow:auto}
#top{background:linear-gradient(90deg,#0a246a,#a6caf0);color:#fff;font-weight:bold;padding:3px 8px}
#menu{display:flex;gap:2px;padding:1px 4px;position:relative;z-index:50;flex-wrap:wrap}
.mi{position:relative;padding:3px 8px;cursor:pointer}.mi:hover,.mi.o{background:#0a246a;color:#fff}
.dd{display:none;position:absolute;left:0;top:100%;background:#d4d0c8;color:#000;min-width:240px;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:2px}
.mi.o .dd{display:block}.dd div{padding:4px 14px;white-space:nowrap}.dd div:hover{background:#0a246a;color:#fff}.dd hr{margin:2px 0}
#tb{display:flex;gap:2px;padding:2px 4px;border-top:1px solid #fff;border-bottom:1px solid #808080;align-items:center;flex-wrap:wrap}
.tbtn{font:12px Tahoma,Arial;padding:3px 8px;background:#d4d0c8;border:2px solid;border-color:#fff #808080 #808080 #fff;cursor:pointer;color:#000}
.tbtn:active{border-color:#808080 #fff #fff #808080}
.sep{width:2px;height:20px;border-left:1px solid #808080;border-right:1px solid #fff;margin:0 4px}
#main{flex:1;display:flex;min-height:0;gap:3px;padding:3px}
.pn{background:#d4d0c8;border:2px solid;border-color:#fff #808080 #808080 #fff;display:flex;flex-direction:column;min-height:0}
.pn.hidden-win{display:none}
.pt{background:#0a246a;color:#fff;padding:1px 4px;font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.pclose{background:#d4d0c8;color:#000;border:1px solid;border-color:#fff #404040 #404040 #fff;font:bold 10px Tahoma,Arial;width:15px;height:14px;line-height:11px;text-align:center;padding:0;cursor:pointer}
.pclose:active{border-color:#404040 #fff #fff #404040}
.bd{background:#fff;overflow:auto;flex:1;margin:2px;border:1px solid #808080}
#tx{display:grid;grid-template-columns:32px 32px;gap:2px;padding:4px;align-content:start}
.tl{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2px solid;border-color:#fff #808080 #808080 #fff;cursor:pointer;font-size:13px;background:#d4d0c8}
.tl.on{border-color:#808080 #fff #fff #808080;background:#eee}
#cen{flex:1;background:#808080;overflow:auto;padding:12px;min-width:0;display:flex;flex-direction:column;border:2px solid;border-color:#808080 #fff #fff #808080}
#formwin{align-self:flex-start;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:3px;max-width:100%}
.tbar{background:linear-gradient(90deg,#0a246a,#a6caf0);color:#fff;font-weight:bold;padding:2px 6px}
#form{position:relative;overflow:hidden;margin-top:3px;border:1px solid #404040;max-width:100%}
.design #form,.fm{background-image:radial-gradient(#000 .7px,transparent .8px);background-size:8px 8px}
.c{position:absolute;z-index:1;display:flex}
.c>*:not(.h){flex:1;min-width:0;font:inherit;color:inherit}
.design .c>*:not(.h){pointer-events:none}.design .c{cursor:move}
.c.sel{outline:1px dashed #000}
.h{position:absolute;width:7px;height:7px;background:#000;z-index:5}
.lb{white-space:pre-wrap;align-self:flex-start;padding:2px}
.c input:not([type]),.c select{border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;font:inherit;padding:1px 3px;color:#000}
.c button{border:2px solid;border-color:#fff #404040 #404040 #fff;background:inherit;font:inherit;color:inherit}
.c label{display:flex;align-items:center;gap:4px}.c label input{flex:none}
.c fieldset{border:1px solid #808080;margin:0;padding:0 4px}
.ls{background:#fff;color:#000;border:2px solid;border-color:#808080 #fff #fff #808080;overflow:auto}
.ls div{padding:0 3px}.ls div.on{background:#0a246a;color:#fff}
.picbox,.imgctl{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.picbox{border:2px solid;border-color:#808080 #fff #fff #808080}
.imgctl{border:1px dashed #666}
.picbox img,.imgctl img{max-width:100%;max-height:100%;pointer-events:none}
.picbox.stretch img,.imgctl.stretch img{width:100%;height:100%;max-width:none;max-height:none;object-fit:fill}
.pic-ph{font-size:10px;color:#404040;text-align:center;line-height:1.25;padding:2px}
.tmrbox{width:100%;height:100%;background:#fff9c4;border:1px solid #808080;display:flex;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:bold;color:#000}
.dirbox,.filebox{width:100%;height:100%;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:2px 4px;font-size:10px;overflow:auto;text-align:left;direction:ltr}
.databox{width:100%;height:100%;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;display:flex;align-items:center;justify-content:space-between;padding:1px 3px;font-size:9px;gap:2px}
.databox span{border:1px solid #666;padding:0 3px;background:#e4e1db}
.olebox{width:100%;height:100%;background:#f5f5f5;border:1px solid #404040;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;color:#0a246a}
.rub{position:absolute;border:1px dashed #000;z-index:9}
#pr{position:absolute;left:4px;top:4px;white-space:pre;pointer-events:none;z-index:0}
#codewin{display:none;flex:1;flex-direction:column;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:3px;min-height:380px}
#code{flex:1;border:2px solid;border-color:#808080 #fff #fff #808080;font:14px Consolas,"Courier New",monospace;white-space:pre;tab-size:4;resize:none;direction:ltr;user-select:text;outline:0;margin-top:2px}
#rt{width:240px;display:flex;flex-direction:column;gap:3px;flex-shrink:0}
#rt.all-hidden{display:none}
#pg table{width:100%;border-collapse:collapse}
#pg td{border:1px solid #d4d0c8;padding:0 3px;height:20px;white-space:nowrap}
#pg td input,#pg td select{width:100%;border:0;font:inherit;padding:0;background:transparent;user-select:text;color:#000}
#pg td:first-child{width:88px;background:#f4f4f4}
.pic-prop-wrap{display:flex;align-items:center;justify-content:space-between;gap:2px}
.pic-prop-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;flex:1}
.pic-prop-btn{font-size:10px;padding:0 4px;cursor:pointer;background:#d4d0c8;border:1px solid #404040}
.scr{margin:6px auto;width:128px;height:96px;background:#008080;border:2px solid #404040;position:relative}
#lf{position:absolute;left:36px;top:24px;background:#d4d0c8;border:1px solid #000;cursor:grab}
#st{padding:2px 8px;border-top:1px solid #808080}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:99}
.dl{background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;min-width:300px;max-width:520px;padding:3px}
.db{padding:14px;display:flex;gap:12px;align-items:flex-start;user-select:text;white-space:pre-wrap}
.dl input{user-select:text}.bt{display:flex;gap:8px;justify-content:center;padding:6px}.bt button{min-width:72px}.ic{font-size:26px}
#sheet {
  display: none;
}

#sheet h2 {
  text-align: center;
  margin: 0 0 8px;
}

#sheet h3 {
  margin: 14px 0 6px;
}

#sheet .meta {
  display: flex;
  justify-content: space-between;
  border-bottom: 2px solid #000;
  padding: 6px 0;
  gap: 8px;
  flex-wrap: wrap;
}

#sheet table {
  border-collapse: collapse;
  width: 100%;
  direction: ltr;
}

#sheet td, #sheet th {
  border: 1px solid #000;
  padding: 4px 6px;
  text-align: center;
  font-size: 12px;
}

#sheet pre {
  direction: ltr;
  text-align: left;
  border: 1px solid #888;
  padding: 8px;
  font: 12px Consolas, monospace;
  white-space: pre-wrap;
}

.wt {
  display: inline-block;
  border: 2px solid #000;
  background: #d4d0c8;
  direction: ltr;
  text-align: left;
}

.wt .tbar {
  background: linear-gradient(90deg, #0a246a, #a6caf0);
  color: #fff;
  font-weight: bold;
  padding: 2px 6px;
  direction: ltr;
  text-align: left;
}

.wt .fm {
  position: relative;
  overflow: hidden;
  background-image: radial-gradient(#000 .7px, transparent .8px);
  background-size: 8px 8px;
}

@media print {
  @page {
    size: A4 portrait;
    margin: 10mm;
  }

  body > *:not(#sheet) {
    display: none !important;
  }

  html, body {
    height: auto;
    overflow: visible;
    min-width: 0;
    background: #fff;
  }

  #sheet {
    display: block !important;
    direction: rtl;
    font: 14px Arial, sans-serif;
    background: #fff;
    color: #000;
    padding: 4mm;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  #pf {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: visible;
    padding: 6px 0;
  }
}
/* Mobile Responsive Layout so Form1 is not covered by right panels */
@media (max-width: 768px){
  body{min-width:0;height:auto;overflow:auto}
  #main{flex-direction:column;overflow:visible}
  #main>.pn{width:100% !important}
  #tx{grid-template-columns:repeat(9,32px);justify-content:center}
  #cen{min-height:300px;padding:8px}
  #rt{width:100%}
  #pg{max-height:220px}
}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body>*:not(#sheet){display:none!important}
  html,body{height:auto;overflow:visible;min-width:0;background:#fff}
  #sheet{display:block;direction:rtl;font:14px Arial,sans-serif;background:#fff;color:#000;padding:4mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head>
<body class="design">
<input type="file" id="picPicker" accept="image/*" style="display:none">

<div id="top" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
  <div>Project1 - Visual Basic Simulator <span id="mode">[design]</span> · محاكي فيجوال بيزك</div>
  <button type="button" class="tbtn" onclick="goBackDashboard()">↩ رجوع للوحة التحكم</button>
</div>


<div id="menu"></div><div id="tb"></div>
<div id="main">
 <div class="pn" style="width:80px"><div class="pt"><span>Toolbox</span></div><div id="tx"></div></div>
 <div id="cen">
  <div id="formwin"><div class="tbar" id="ftitle"></div><div id="form"><div id="pr"></div></div></div>
  <div id="codewin"><div class="tbar">Project1 - Code</div>
   <div style="display:flex;gap:6px;padding:3px 0"><select id="co" style="flex:1"></select><select id="cp" style="flex:1"></select></div>
   <textarea id="code" spellcheck="false"></textarea></div>
 </div>
 <div id="rt">
  <div class="pn" id="winExplorer" style="height:150px"><div class="pt"><span>Project Explorer</span><button class="pclose" title="إغلاق النافذة (يمكن إظهارها من View)" onclick="toggleWin('explorer',false)">×</button></div><div class="bd" id="ex"></div></div>
  <div class="pn" id="winProps" style="flex:1"><div class="pt"><span>Properties</span><button class="pclose" title="إغلاق النافذة (يمكن إظهارها من View)" onclick="toggleWin('props',false)">×</button></div><select id="os"></select><div class="bd" id="pg"></div></div>
  <div class="pn" id="winLayout" style="height:140px"><div class="pt"><span>Form Layout</span><button class="pclose" title="إغلاق النافذة (يمكن إظهارها من View)" onclick="toggleWin('layout',false)">×</button></div><div class="scr" id="layoutScr"><div id="lf"></div></div></div>
 </div>
</div>
<div id="st"></div><div id="sheet"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T={
  label:{p:"Label",w:88,h:24},
  text:{p:"Text",w:112,h:24},
  button:{p:"Command",w:96,h:32},
  check:{p:"Check",w:104,h:24},
  option:{p:"Option",w:104,h:24},
  frame:{p:"Frame",w:160,h:104},
  list:{p:"List",w:112,h:88},
  combo:{p:"Combo",w:112,h:24},
  picture:{p:"Picture",w:120,h:88},
  hscroll:{p:"HScroll",w:130,h:20},
  timer:{p:"Timer",w:42,h:32},
  dir:{p:"Dir",w:120,h:80},
  file:{p:"File",w:116,h:80},
  image:{p:"Image",w:116,h:84},
  data:{p:"Data",w:148,h:24},
  ole:{p:"OLE",w:112,h:68}
};
const TN={
  label:"Label",text:"TextBox",button:"CommandButton",check:"CheckBox",option:"OptionButton",
  frame:"Frame",list:"ListBox",combo:"ComboBox",picture:"PictureBox",hscroll:"HScrollBar",
  timer:"Timer",dir:"DirListBox",file:"FileListBox",image:"Image",data:"Data",ole:"OLE"
};
const EV={
  form:["Load","Click","DblClick"],
  label:["Click","DblClick"],
  text:["Change","Click"],
  button:["Click"],
  check:["Click"],
  option:["Click"],
  frame:["Click"],
  list:["Click","DblClick"],
  combo:["Click","Change"],
  picture:["Click","DblClick"],
  hscroll:["Change","Click"],
  timer:["Timer"],
  dir:["Click","Change"],
  file:["Click","DblClick"],
  image:["Click","DblClick"],
  data:["Click"],
  ole:["Click","DblClick"]
};
const TOOLS=[
  ["","↖","Pointer"],
  ["label","A","Label"],
  ["text","ab","TextBox"],
  ["button","▭","CommandButton"],
  ["check","☑","CheckBox"],
  ["option","◉","OptionButton"],
  ["frame","▢","Frame"],
  ["list","☰","ListBox"],
  ["combo","▾","ComboBox"],
  ["picture","🖼️","PictureBox"],
  ["hscroll","↔","HScrollBar"],
  ["timer","⏱️","Timer"],
  ["dir","📁","DirListBox"],
  ["file","📄","FileListBox"],
  ["image","🌄","Image"],
  ["data","🗄️","Data"],
  ["ole","OLE","OLE"]
];
let M,sel,tool=null,running=false,snap,P,cnt={},last={},timers=[];
let winState={explorer:true,props:true,layout:true},pendingPicCtrl=null;
const F=$("#form"),PR=$("#pr"),sn=v=>Math.round(v/8)*8,elOf=c=>F.querySelector(`[data-n="${c.name}"]`);

function dlg(t,h,b){return new Promise(r=>{const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class=dl><div class=tbar>${esc(t)}</div><div class=db>${h}</div><div class=bt>${b.map((x,i)=>`<button class=tbtn data-i=${i}>${x}</button>`).join("")}</div></div>`;document.body.append(o);o.onclick=e=>{const k=e.target.closest("button");if(k){o.remove();r({i:+k.dataset.i,o})}};o.onkeydown=e=>{if(e.key=="Enter")o.querySelector("button").click()};(o.querySelector("input")||o.querySelector("button")).focus()})}
function drag(e,fn,done){const sx=e.clientX,sy=e.clientY,mv=ev=>fn(ev.clientX-sx,ev.clientY-sy),up=()=>{removeEventListener("mousemove",mv);removeEventListener("mouseup",up);done&&done()};addEventListener("mousemove",mv);addEventListener("mouseup",up);e.preventDefault()}

/* ---------- window visibility (Explorer / Properties / Form Layout) ---------- */
function applyMobilePanels(){if(window.innerWidth<=768){winState.explorer=false;winState.layout=false}syncWins()}
function toggleWin(k,force){winState[k]=typeof force==="boolean"?force:!winState[k];syncWins()}
function syncWins(){
  $("#winExplorer").classList.toggle("hidden-win",!winState.explorer);
  $("#winProps").classList.toggle("hidden-win",!winState.props);
  $("#winLayout").classList.toggle("hidden-win",!winState.layout);
  $("#rt").classList.toggle("all-hidden",!winState.explorer&&!winState.props&&!winState.layout);
  renderMenus();
}

/* ---------- project explorer ---------- */
function renderExplorer(){
  const ex=$("#ex");
  if(!ex||!M)return;
  const fSel=sel==="form"||!sel;
  ex.innerHTML=
    `<div style="padding:2px 4px;font-weight:bold;color:#0a246a">📁 Project1 (Project1.vbp)</div>`+
    `<div style="padding:2px 14px;color:#404040">📁 Forms</div>`+
    `<div class="tree-node${fSel?" active":""}" style="padding-left:24px" onclick="select('form')" ondblclick="if(!running)showCode('Form')">📄 ${esc(M.form.name)} (${esc(M.form.name)}.frm)</div>`+
    M.ctrls.map(c=>
      `<div class="tree-node${sel===c?" active":""}" style="padding-left:34px" onclick="selectByName('${esc(c.name)}')" ondblclick="if(!running)showCode('${esc(c.name)}')">▪ ${esc(c.name)} (${TN[c.type]})</div>`
    ).join("");
}

function selectByName(name){
  const found=M.ctrls.find(x=>x.name===name);
  if(found)select(found);
}

/* ---------- picture upload for PictureBox & Image ---------- */
$("#picPicker").onchange=e=>{
  const file=e.target.files&&e.target.files[0],c=pendingPicCtrl;
  pendingPicCtrl=null;$("#picPicker").value="";
  if(!file||!c)return;
  const rd=new FileReader();
  rd.onload=ev=>{c.picture=ev.target.result;c.picName=file.name;draw();props()};
  rd.readAsDataURL(file);
};
function pickPicture(c){pendingPicCtrl=c;$("#picPicker").click()}

/* ---------- timers during Run mode ---------- */
function clearRunTimers(){timers.forEach(id=>clearInterval(id));timers=[]}
function startRunTimers(){
  clearRunTimers();
  M.ctrls.forEach(c=>{
    if(c.type=="timer"&&c.enabled&&Number(c.interval)>0){
      const id=setInterval(()=>{if(running&&c.enabled)disp(c.name.toLowerCase()+"_timer")},Math.max(20,Number(c.interval)));
      timers.push(id);
    }
  });
}

/* ---------- model / design surface ---------- */
function fmt(){const f=M.form;Object.assign(F.style,{width:f.width+"px",height:f.height+"px",backgroundColor:f.backcolor});$("#ftitle").textContent=f.caption;const lf=$("#lf");lf.style.width=Math.min(72,Math.max(20,f.width/10.24))+"%";lf.style.height=Math.min(72,Math.max(16,f.height/7.68))+"%"}
function add(t,x,y,w,h,o){const k=T[t];cnt[t]=(cnt[t]||0)+1;const n=k.p+cnt[t];
 const c={type:t,name:n,left:Math.max(0,x),top:Math.max(0,y),width:w||k.w,height:h||k.h,backcolor:["text","list","combo","picture","dir","file"].includes(t)?"#ffffff":t=="button"?"#d4d0c8":"",forecolor:"#000000",fontsize:13,enabled:true,visible:true};
 if(["label","button","check","option","frame"].includes(t))c.caption=n;
 if(t=="text"||t=="combo")c.text=n;if(t=="check")c.value=0;if(t=="option")c.value=false;if(t=="list"||t=="combo"){c.items=[];c.sel=-1}
 if(t=="picture"||t=="image"){c.picture="";c.picName="(None)";c.stretch=true}
 if(t=="hscroll"){c.value=50;c.min=0;c.max=100}
 if(t=="timer"){c.interval=1000}
 Object.assign(c,o);M.ctrls.push(c);select(c);return c}

function mk(c){
  const d=document.createElement("div"),t=c.type,n=esc(c.caption),dis=c.enabled?"":" disabled";
  d.className="c";d.dataset.n=c.name;
  const s=d.style;
  Object.assign(s,{left:c.left+"px",top:c.top+"px",width:c.width+"px",height:c.height+"px",color:c.forecolor,fontSize:c.fontsize+"px",zIndex:t=="frame"?0:1});
  if(c.backcolor)s.background=c.backcolor;
  if(!c.visible){running?s.display="none":s.opacity=.45}

  if(t=="label")d.innerHTML=`<span class=lb>${n}</span>`;
  else if(t=="text")d.innerHTML=`<input value="${esc(c.text)}"${dis}>`;
  else if(t=="button")d.innerHTML=`<button${dis}>${n}</button>`;
  else if(t=="check")d.innerHTML=`<label><input type=checkbox${c.value==1?" checked":""}${dis}>${n}</label>`;
  else if(t=="option")d.innerHTML=`<label><input type=radio name=o${c.value?" checked":""}${dis}>${n}</label>`;
  else if(t=="frame")d.innerHTML=`<fieldset><legend>${n}</legend></fieldset>`;
  else if(t=="list")d.innerHTML=`<div class=ls>${c.items.map((x,i)=>`<div class="${i==c.sel?"on":""}" data-i=${i}>${esc(x)}</div>`).join("")}</div>`;
  else if(t=="combo")d.innerHTML=`<select${dis}>${c.items.includes(c.text)?"":`<option selected>${esc(c.text)}</option>`}${c.items.map(x=>`<option${x==c.text?" selected":""}>${esc(x)}</option>`).join("")}</select>`;
  else if(t=="picture"||t=="image"){
    const cls=t=="picture"?"picbox":"imgctl",st=c.stretch!==false?" stretch":"";
    d.innerHTML=c.picture?`<div class="${cls}${st}"><img src="${c.picture}" alt="${esc(c.picName||c.name)}"></div>`:`<div class="${cls}${st}"><div class=pic-ph>${esc(c.name)}<br><span style="color:#666">Picture</span></div></div>`;
  }
  else if(t=="hscroll"){
    d.innerHTML=`<input type=range min="${c.min??0}" max="${c.max??100}" value="${c.value??50}"${dis}>`;
  }
  else if(t=="timer"){
    d.innerHTML=`<div class=tmrbox>⏱️<span>${esc(c.name)}</span></div>`;
  }
  else if(t=="dir"){
    d.innerHTML=`<div class=dirbox><div style="color:#b8860b;font-weight:bold">📁 C:\\</div><div style="padding-left:8px;color:#d4a017">📁 VB6</div></div>`;

   else if(k=="value")c.value=c.type=="check"?(v==1||v===true||v===-1?1:0):(c.type=="hscroll"?+v:!!v);else if(["caption","text","backcolor","forecolor","picture"].includes(k))c[k]=String(fn(v));else return true;rd();if(k=="interval"||k=="enabled")startRunTimers();return true}})}
async function disp(n){const f=P&&P[n];if(!f||!running)return;try{await f()}catch(e){if(e==="VBEND")stop();else if(running)dlg("Run-time error",`<div class=ic>✖</div><div>${esc(e.message||e)}</div>`,["End"]).then(stop)}}

/* ---------- print student work ---------- */
async function printF() {
  if (running) stop();
  showView("obj");

  const r = await dlg(
    "طباعة الفورم - Print Form",
    `<div dir="rtl" style="line-height:2.1">اسم الطالب: <input id="sn" dir="auto"><br>الصف / الشعبة: <input id="sc" dir="auto"><br><label><input type="checkbox" id="ic" checked> طباعة الكود البرمجي</label><br><label><input type="checkbox" id="ip" checked> طباعة جدول خصائص الأدوات</label></div>`,
    ["🖨 طباعة", "إلغاء"]
  );
  if (r.i) return;

  const g = id => esc(r.o.querySelector("#" + id).value) || "..........";
  const cb = id => r.o.querySelector("#" + id).checked;

  const w = document.createElement("div");
  w.className = "wt";
  w.innerHTML = `<div class="tbar">${esc(M.form.caption)}</div>`;

  const fc = document.createElement("div");
  fc.className = "fm";
  fc.style.width = M.form.width + "px";
  fc.style.height = M.form.height + "px";
  fc.style.backgroundColor = M.form.backcolor || "#f0f0f0";

  M.ctrls.forEach(c => {
    const el = mk(c);
    el.classList.remove("sel");
    el.querySelectorAll(".h").forEach(h => h.remove());
    el.style.left = c.left + "px";
    el.style.top = c.top + "px";
    el.style.width = c.width + "px";
    el.style.height = c.height + "px";
    fc.append(el);
  });

  w.append(fc);

  const maxW = 640;
  if (M.form.width > maxW) {
    const scale = maxW / M.form.width;
    w.style.transform = `scale(${scale})`;
    w.style.transformOrigin = "top center";
    w.style.marginBottom = ((M.form.height + 28) * (scale - 1)) + "px";
  }

  $("#sheet").innerHTML =
    `<h2>واجب الحاسوب - تصميم برنامج بلغة Visual Basic</h2>` +
    `<div class="meta"><span>اسم الطالب: ${g("sn")}</span><span>الصف: ${g("sc")}</span><span>التاريخ: ${new Date().toLocaleDateString("ar")}</span></div>` +
    `<h3>1) تصميم الفورم</h3><div id="pf"></div>` +
    (cb("ip")
      ? `<h3>2) خصائص الأدوات</h3><table><thead><tr><th>Name</th><th>Type</th><th>Caption / Text</th><th>Left</th><th>Top</th><th>Width</th><th>Height</th></tr></thead><tbody>` +
        (M.ctrls.map(c =>
          `<tr><td>${esc(c.name)}</td><td>${TN[c.type]}</td><td dir="auto">${esc(c.caption ?? c.text ?? c.picName ?? "")}</td><td>${c.left}</td><td>${c.top}</td><td>${c.width}</td><td>${c.height}</td></tr>`
        ).join("") || `<tr><td colspan="7">-</td></tr>`) +
        `</tbody></table>`
      : "") +
    (cb("ic")
      ? `<h3>3) الكود البرمجي</h3><pre>${esc(M.code) || "(لا يوجد كود)"}</pre>`
      : "");

  $("#pf").append(w);

  setTimeout(() => {
    try {
      print();
    } catch (e) {
      dlg("Print", "<div dir=\"rtl\">تعذرت الطباعة داخل هذه النافذة. افتح الصفحة في تبويب جديد ثم أعد المحاولة.</div>", ["OK"]);
    }
  }, 180);
}
