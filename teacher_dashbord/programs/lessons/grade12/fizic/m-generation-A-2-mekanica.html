<script>

    let currentQIndex = 0;

    // قائمة الحروف لترتيب الخيارات
    const arabicLetters = ['أ', 'ب', 'ج', 'د', 'هـ', 'و'];

    // دالة لتنظيف النص وتنسيقه بحروف أ، ب، ج، د...
    function formatOptionText(text, index) {
        if (!text) return '';
        const cleanText = text.replace(/^[أ-يA-Za-z][\)\.\-]\s*/, '');
        const letter = arabicLetters[index] || (index + 1);
        return `${letter}) ${cleanText}`;
    }

    console.log("عدد الأسئلة في المصفوفة A-2: " + (typeof questionsMatrix !== 'undefined' ? questionsMatrix.length : 0));

    function navigateQuestion(direction) {
        const newIndex = currentQIndex + direction;
        if (typeof questionsMatrix !== 'undefined' && newIndex >= 0 && newIndex < questionsMatrix.length) {
            currentQIndex = newIndex;
            renderActiveQuestion(currentQIndex);
        }
    }

    function renderActiveQuestion(index) {
        if (typeof questionsMatrix === 'undefined' || !questionsMatrix[index]) return;
        const data = questionsMatrix[index];

        document.getElementById('q-source').innerText = data.title;
        document.getElementById('main-question-text').innerText = data.text;
        document.getElementById('question-counter').innerHTML = `مسألة ${index + 1} / ${questionsMatrix.length}`;

        const graphicContainer = document.getElementById('graphic-container');
        if (data.svgCode && data.svgCode.trim() !== "") {
            graphicContainer.innerHTML = data.svgCode;
        } else if (data.imagePath && data.imagePath.trim() !== "") {
            graphicContainer.innerHTML = `<img src="${data.imagePath}" alt="رسم توضيحي">`;
        } else {
            graphicContainer.innerHTML = '<p class="no-graphic">⚠️ لا يوجد رسم توضيحي</p>';
        }

        document.getElementById('prev-btn').disabled = index === 0;
        document.getElementById('next-btn').disabled = index === questionsMatrix.length - 1;

        const stepsContainer = document.getElementById('steps-container');
        stepsContainer.innerHTML = '';

        if (data.steps) {
            data.steps.forEach((step, sIdx) => {
                let optionsHTML = '';
                if (step.options) {
                    step.options.forEach((opt, optIdx) => {
                        const rawText = typeof opt === 'object' ? opt.text : opt;
                        const formattedText = formatOptionText(rawText, optIdx);
                        optionsHTML += `
                            <button class="option-btn" onclick="checkLiveAnswer(this, ${sIdx}, ${opt.isCorrect})" data-feedback="${step.feedback}">
                                <span>${formattedText}</span>
                                <i class="fa-regular fa-circle"></i>
                            </button>
                        `;
                    });
                }

                stepsContainer.innerHTML += `
                    <div class="step-card ${sIdx === 0 ? 'active' : ''}" id="step-card-${sIdx}">
                        <div class="step-title">${step.title}</div>
                        <div class="step-question">${step.question}</div>
                        <div class="options-grid">${optionsHTML}</div>
                        <div class="feedback-box" id="feedback-${sIdx}"></div>
                    </div>
                `;
            });
        }
    }

    function checkLiveAnswer(btn, sIdx, isCorrect) {
        const card = document.getElementById(`step-card-${sIdx}`);
        const fb = document.getElementById(`feedback-${sIdx}`);

        card.querySelectorAll('.option-btn').forEach(b => {
            b.classList.remove('correct', 'wrong');
            b.querySelector('i').className = 'fa-regular fa-circle';
        });

        if (isCorrect) {
            btn.classList.add('correct');
            btn.querySelector('i').className = 'fa-solid fa-circle-check';
            fb.innerHTML = `<i class="fa-solid fa-check"></i> ${btn.getAttribute('data-feedback')}`;
            fb.className = 'feedback-box success';
            card.classList.add('completed');
            card.classList.remove('active');

            const nextCard = document.getElementById(`step-card-${sIdx + 1}`);
            if (nextCard) {
                nextCard.classList.add('active');
                nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        } else {
            btn.classList.add('wrong');
            btn.querySelector('i').className = 'fa-solid fa-circle-xmark';
        }
    }

            <div class="school-name" style="font-size: 22px; color: #1a365d; margin-bottom: 20px;">مدرسة أمجاد افريقيا - ليبيا - البيضاء</div>
            <div class="main-title" style="font-size: 42px; font-weight: 800; color: #0f172a; margin-bottom: 10px;">الميكانيكا</div>
            <div class="sub-title" style="font-size: 28px; font-weight: 600; color: #334155; margin-bottom: 20px;">الصف الثالث الثانوي</div>
            <div class="cover-frame" style="border: 3px solid #1a365d; border-radius: 16px; padding: 30px; margin: 20px 0; background: #f8fafc;">
                <h3 style="font-size: 30px; color: #1e293b;">📖 الباب الثاني الاحتكاك 📖</h3>
                <div style="font-size: 20px; color: #64748b;">الميكانيكا</div>
                <div style="font-size: 24px; font-weight: 700; color: #0f172a; margin-top: 15px;">العام الدراسي 2026 - 2027</div>
            </div>
            <div style="font-size: 22px; color: #059669; margin: 15px 0;">✨ إهداء إلى طلبتنا المتميزين ✨</div>
            <div style="font-size: 16px; color: #475569;">
                رابط البوت التعليمي:<br>
                <a href="http://t.me/amjad_africa2027bot" style="color: #2563eb; text-decoration: none;">t.me/amjad_africa2027bot</a>
            </div>
        `;
        printableDoc.appendChild(coverPage);

        // ==========================================
        // الصفحة 2 و 3: أوراق القوانين الفيزيائية وملاخص الاحتكاك
        // ==========================================
        if (typeof addFrictionTheoryPage1 === 'function') {
            addFrictionTheoryPage1();
        }
        if (typeof addFrictionTheoryPage2 === 'function') {
            addFrictionTheoryPage2();
        }
        if (typeof addQuestionsStartPage === 'function') {
            addQuestionsStartPage();
        }

        // ==========================================
        // دالة مساعدة لتوليد كتل الأسئلة
        // ==========================================
        function renderQuestionBlock(q, questionNumber) {
            let fontSize = 14;
            let optionsHtml = '';
            let optionsList = q.options || [];

            let cleanQuestionText = q.text || '';
            if (optionsList.length === 0 && cleanQuestionText.includes('(أ)')) {
                const parts = cleanQuestionText.split(/\((?:أ|ب|ج|د)\)/);
                cleanQuestionText = parts[0].trim();
                const matches = q.text.match(/\((?:أ|ب|ج|د)\)\s*[^(\n]+/g);
                if (matches) {
                    optionsList = matches.map(m => ({ text: m.replace(/\((?:أ|ب|ج|د)\)\s*/, '').trim() }));
                }
            }

            if (optionsList.length > 0) {
                optionsHtml += `<div class="pdf-options-container" style="display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; width: 100%; direction: rtl;">`;
                optionsList.forEach((opt, optIdx) => {
                    const rawText = typeof opt === 'object' ? opt.text : opt;
                    const formattedText = typeof formatOptionText === 'function' ? formatOptionText(rawText, optIdx) : rawText;
                    optionsHtml += `
                        <div class="pdf-option-item" style="flex: 0 0 calc(50% - 4px); max-width: calc(50% - 4px); box-sizing: border-box; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; font-size: ${fontSize}px; text-align: right; direction: rtl;">
                            📌 <span dir="auto">${formattedText}</span>
                        </div>
                    `;
                });
                optionsHtml += `</div>`;
            }

            let stepsHtml = '';
            if (q.pdfSolutionSteps && q.pdfSolutionSteps.length > 0) {
                q.pdfSolutionSteps.forEach(s => {
                    if (s && s.trim()) {
                        stepsHtml += `<div style="padding: 2px 0; font-size: ${fontSize}px; line-height: 1.5;">${s}</div>`;
                    }
                });
            }

            let graphicHtml = '';
            if (q.svgCode && q.svgCode.trim() !== "") {
                graphicHtml = `<div class="pdf-graphic" style="text-align: center; margin: 4px 0; padding: 4px;">${q.svgCode}</div>`;
            } else if (q.imagePath && q.imagePath.trim() !== "") {
                graphicHtml = `<div class="pdf-graphic" style="text-align: center; margin: 4px 0;"><img src="${q.imagePath}" alt="رسم توضيحي" style="max-width: 100%;"></div>`;
            }

            const questionDiv = document.createElement('div');
            questionDiv.className = 'pdf-question-block';
            questionDiv.style.cssText = `
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                margin-bottom: 12px !important;
                padding-bottom: 8px !important;
                border-bottom: 1px dashed #cbd5e1;
                display: block;
                width: 100%;
            `;

            questionDiv.innerHTML = `
                <div class="pdf-q-title" style="font-size: ${fontSize + 2}px; font-weight: bold; color: #1a365d; margin-bottom: 3px;">${questionNumber}. ${q.title || ''}</div>
                <div class="pdf-q-text" style="font-size: ${fontSize + 1}px; line-height: 1.6; color: #2d3748; margin-bottom: 3px;">${cleanQuestionText}</div>
                ${graphicHtml}
                ${optionsHtml}
                <div class="pdf-solution-box" style="margin-top: 4px; padding-top: 4px; border-top: 1px dashed #edf2f7;">
                    <div class="pdf-sol-steps" style="padding-right: 6px; color: #2d3748;">${stepsHtml || 'لا يوجد حل متاح'}</div>
                    ${q.pdfFinalAnswer ? `<div class="pdf-final-ans" style="font-size: ${fontSize}px; font-weight: bold; margin-top: 4px; color: #065f46; padding: 2px 6px; background-color: #f0fdf4; border-radius: 4px; display: inline-block;">${q.pdfFinalAnswer}</div>` : ''}
                </div>
            `;
            return questionDiv;
        }

        // ==========================================
        // أولاً: عرض تمارين (2-A) مباشرة داخل printableDoc
        // ==========================================
        const mainPageA = document.createElement('div');
        mainPageA.className = 'print-page-box';
        mainPageA.style.cssText = `page-break-after: auto; break-after: auto; min-height: auto; height: auto; padding: 4mm 6mm 5mm 6mm;`;

        const pairContainerA = document.createElement('div');
        pairContainerA.className = 'pdf-questions-pair-container';
        pairContainerA.style.cssText = `display: block; width: 100%;`;

        if (typeof questionsMatrix !== 'undefined' && questionsMatrix.length > 0) {
            questionsMatrix.forEach((q, index) => {
                pairContainerA.appendChild(renderQuestionBlock(q, index + 1));
            });
        }
        mainPageA.appendChild(pairContainerA);
        printableDoc.appendChild(mainPageA);

        // ==========================================
        // ثانياً: إدراج الصفحة الفاصلة لتمارين (2-B)
        // ==========================================
        if (typeof addSectionDividerPage === 'function') {
            addSectionDividerPage(
                "تمارين (2-B)", 
                "مجموعة المسائل الشاملة والمتقدمة لدرس الاحتكاك (تطبيقات متقدمة وعجلة القطار)"
            );
        }

        // ==========================================
        // ثالثاً: عرض تمارين (2-B) من المصفوفة الجديدة
        // ==========================================
        const mainPageB = document.createElement('div');
        mainPageB.className = 'print-page-box';
        mainPageB.style.cssText = `page-break-after: auto; break-after: auto; min-height: auto; height: auto; padding: 4mm 6mm 5mm 6mm;`;

        const pairContainerB = document.createElement('div');
        pairContainerB.className = 'pdf-questions-pair-container';
        pairContainerB.style.cssText = `display: block; width: 100%;`;

        if (typeof exercises2B !== 'undefined' && exercises2B.length > 0) {
            exercises2B.forEach((q, index) => {
                pairContainerB.appendChild(renderQuestionBlock(q, index + 1));
            });
        }
        mainPageB.appendChild(pairContainerB);
        printableDoc.appendChild(mainPageB);

        // ==========================================
        // تذييل الصفحة الأخيرة
        // ==========================================
        const pageFooter = document.createElement('div');
        pageFooter.className = 'page-footer-number';
        pageFooter.style.cssText = `
            text-align: center;
            font-size: 11px;
            color: #666;
            border-top: 1px solid #ddd;
            padding-top: 5px;
            margin-top: 6px;
        `;
        pageFooter.innerHTML = `⚡ - هذه المذكرة خاصة بطلبة مدرسة أمجاد أفريقيا (ليبيا - البيضاء) - ⚡`;
        printableDoc.appendChild(pageFooter);

        setTimeout(() => {
            window.print();
        }, 400);
    }

    window.onload = () => {
        renderActiveQuestion(0);
    };

    document.addEventListener('DOMContentLoaded', function() {
        if (typeof renderMathInElement === 'function') {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '\\[', right: '\\]', display: true},
                    {left: '\\(', right: '\\)', display: false}
                ]
            });
        }
    });
</script>
</body>
</html>
