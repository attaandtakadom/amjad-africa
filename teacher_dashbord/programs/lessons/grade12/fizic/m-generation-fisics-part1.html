<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>مكثف الفيزياء - مدرسـة أمجاد أفريقيا</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style1.css">
    <!-- إضافة KaTeX لعرضلعرضلعرض الصيغ الرياضية -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2><i class="fa-solid fa-desktop"></i>مكثف الفيزياء    </h2>
        <span class="school-badge">مدرسة أمجاد أفريقيا - ليبيا</span>
        <span id="question-counter"></span>
                    <a href="generated-bdf-fisizs-allparts.html" class="nav-btn">⚙️ لوحة التحكم</a>



    </div>

    <div class="question-container">
        <div class="question-meta">
            <span class="q-source-span" id="q-source"></span>
        </div>
        <div class="question-text" id="main-question-text"></div>
        <div class="question-graphic-area" id="graphic-container"></div>
    </div>

    <div class="steps-container" id="steps-container"></div>

    <div class="navigation-area">
        <button class="nav-btn" id="prev-btn" onclick="navigateQuestion(-1)">
            <i class="fa-solid fa-arrow-right"></i> السابق
        </button>
        <button class="nav-btn" id="next-btn" onclick="navigateQuestion(1)">
            التالي <i class="fa-solid fa-arrow-left"></i>
        </button>
    </div>
</div>

<div class="print-section">
    <button class="print-btn" onclick="triggerSmartPrint()">
        <i class="fa-solid fa-file-pdf"></i> طباعة PDF
    </button>
    <a href="https://t.me/amjad_africa2027bot" target="_blank" class="bot-link-btn">
        <i class="fa-brands fa-telegram"></i> البوت التعليمي
    </a>
</div>

<div id="printable-pdf-document"></div>
<div id="dynamic-pdf-questions-area"></div>

<script>
    // منع التخزين المؤقت
    document.write('<script src="array-part1.js?v=' + Date.now() + '"><\/script>');
</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<script src="addphysicslawpage-generate-1-2.js"></script>

<script>
    let currentQIndex = 0;

    // قائمة الحروف لترتيب الخيارات
    const arabicLetters = ['أ', 'ب', 'ج', 'د', 'هـ', 'و'];

    // دالة لتنظيف النص وتنسيقه بحروف أ، ب، ج، د...
    function formatOptionText(text, index) {
        if (!text) return '';
        const cleanText = text.replace(/^[أ-يA-Za-z][\)\.\-]\s*/, '');
        const letter = arabicLetters[index] || (index + 1);
        return `${letter}) ${cleanText}`;
    }

    console.log("عدد الأسئلة في المصفوفة: " + questionsMatrix.length);

    function navigateQuestion(direction) {
        const newIndex = currentQIndex + direction;
        if (newIndex >= 0 && newIndex < questionsMatrix.length) {
            currentQIndex = newIndex;
            renderActiveQuestion(currentQIndex);
        }
    }

    function renderActiveQuestion(index) {
        const data = questionsMatrix[index];
        if (!data) return;

        document.getElementById('q-source').innerText = data.title;
        document.getElementById('main-question-text').innerText = data.text;
        document.getElementById('question-counter').innerHTML = `مسألة ${index + 1} / ${questionsMatrix.length}`;

        const graphicContainer = document.getElementById('graphic-container');
        if (data.svgCode && data.svgCode.trim() !== "") {
            graphicContainer.innerHTML = data.svgCode;
        } else if (data.imagePath && data.imagePath.trim() !== "") {
            graphicContainer.innerHTML = `<img src="${data.imagePath}" alt="رسم توضيحي">`;
        } else {
            graphicContainer.innerHTML = '<p class="no-graphic">⚠️ لا يوجد رسم توضيحي</p>';
        }

        document.getElementById('prev-btn').disabled = index === 0;
        document.getElementById('next-btn').disabled = index === questionsMatrix.length - 1;

        const stepsContainer = document.getElementById('steps-container');
        stepsContainer.innerHTML = '';

        if (data.steps) {
            data.steps.forEach((step, sIdx) => {
                let optionsHTML = '';
                if (step.options) {
                    step.options.forEach((opt, optIdx) => {
                        const rawText = typeof opt === 'object' ? opt.text : opt;
                        const formattedText = formatOptionText(rawText, optIdx);
                        optionsHTML += `
                            <button class="option-btn" onclick="checkLiveAnswer(this, ${sIdx}, ${opt.isCorrect})" data-feedback="${step.feedback}">
                                <span>${formattedText}</span>
                                <i class="fa-regular fa-circle"></i>
                            </button>
                        `;
                    });
                }

                stepsContainer.innerHTML += `
                    <div class="step-card ${sIdx === 0 ? 'active' : ''}" id="step-card-${sIdx}">
                        <div class="step-title">${step.title}</div>
                        <div class="step-question">${step.question}</div>
                        <div class="options-grid">${optionsHTML}</div>
                        <div class="feedback-box" id="feedback-${sIdx}"></div>
                    </div>
                `;
            });
        }
    }

    function checkLiveAnswer(btn, sIdx, isCorrect) {
        const card = document.getElementById(`step-card-${sIdx}`);
        const fb = document.getElementById(`feedback-${sIdx}`);

        card.querySelectorAll('.option-btn').forEach(b => {
            b.classList.remove('correct', 'wrong');
            b.querySelector('i').className = 'fa-regular fa-circle';
        });

        if (isCorrect) {
            btn.classList.add('correct');
            btn.querySelector('i').className = 'fa-solid fa-circle-check';
            fb.innerHTML = `<i class="fa-solid fa-check"></i> ${btn.getAttribute('data-feedback')}`;
            fb.className = 'feedback-box success';
            card.classList.add('completed');
            card.classList.remove('active');

            const nextCard = document.getElementById(`step-card-${sIdx + 1}`);
            if (nextCard) {
                nextCard.classList.add('active');
                nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        } else {
            btn.classList.add('wrong');
            btn.querySelector('i').className = 'fa-solid fa-circle-xmark';
        }
    }

    function addQuestionsStartPage() {
        const printableDoc = document.getElementById('printable-pdf-document');
        
        const startPage = document.createElement('div');
        startPage.className = 'pdf-questions-start-page';
        startPage.style.cssText = `
            page-break-after: always;
            break-after: page;
            padding: 20mm 10mm;
            text-align: center;
            font-family: 'Cairo', sans-serif;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        `;
        
        startPage.innerHTML = `
            <div style="font-size: 60px; margin-bottom: 20px;">📝</div>
            <h1 style="font-size: 36px; color: #1a365d; font-weight: 800; margin-bottom: 15px;">أسئلة المراجعة النهائية</h1>
            <div style="width: 60%; height: 3px; background: #2563eb; margin: 15px auto; border-radius: 4px;"></div>
            <p style="font-size: 20px; color: #475569; line-height: 1.8; max-width: 80%;">
                مجموعة من الأسئلة المتنوعة<br>
                مع الحلول النموذجية خطوة بخطوة
            </p>
            <p style="font-size: 16px; color: #94a3b8; margin-top: 20px;">
                ⚡ هذه المذكرة خاصة - لا يجوز نسخها ⚡
            </p>
        `;
        
        printableDoc.appendChild(startPage);
    }

    // ===== دالة الطباعة العامة (Smart Print) =====
// ===== دالة الطباعة العامة المحدثة بالكامل (Smart Print) =====
// ===== دالة الطباعة العامة المحدثة والشاملة (Smart Print) =====
function triggerSmartPrint() {
    const printableDoc = document.getElementById('printable-pdf-document');
    const questionsArea = document.getElementById('dynamic-pdf-questions-area');

    // تفريغ المحتوى السابق لتجنب التكرار
    printableDoc.innerHTML = '';
    
    // إنشاء أو إعادة تهيئة منطقة الأسئلة داخل مستند الطباعة
    let currentQuestionsArea = document.getElementById('dynamic-pdf-questions-area');
    if (!currentQuestionsArea) {
        currentQuestionsArea = document.createElement('div');
        currentQuestionsArea.id = 'dynamic-pdf-questions-area';
    } else {
        currentQuestionsArea.innerHTML = '';
    }

    // 1. حقن ستايل CSS الخاص بضبط خيارات الأسئلة على عمودين (Flexbox) ومنع الانكسار
    let printStyle = document.getElementById('pdf-print-override-style');
    if (!printStyle) {
        printStyle = document.createElement('style');
        printStyle.id = 'pdf-print-override-style';
        document.head.appendChild(printStyle);
    }
    printStyle.innerHTML = `
        @media print {
            .pdf-options-container {
                display: flex !important;
                flex-wrap: wrap !important;
                gap: 6px !important;
                direction: rtl !important;
                width: 100% !important;
                margin: 6px 0 !important;
            }
            .pdf-option-item {
                flex: 0 0 calc(50% - 4px) !important;
                max-width: calc(50% - 4px) !important;
                box-sizing: border-box !important;
                background: #f8fafc !important;
                border: 1px solid #cbd5e1 !important;
                border-radius: 4px !important;
                padding: 4px 8px !important;
                font-size: 13px !important;
                text-align: right !important;
                direction: rtl !important;
            }
        }
    `;

    // ==========================================
    // الصفحة 1: ورقة العنوان (الغلاف الرئيسي)
    // ==========================================
    const coverPage = document.createElement('div');
    coverPage.className = 'pdf-cover-page';
    coverPage.style.cssText = `
        page-break-after: always;
        break-after: page;
        padding: 20mm 10mm;
        text-align: center;
        font-family: 'Cairo', sans-serif;
    `;
    coverPage.innerHTML = `
        <div class="school-name" style="font-size: 22px; color: #1a365d; margin-bottom: 20px;">مدرسة أمجاد أفريقيا - ليبيا - البيضاء</div>
        <div class="main-title" style="font-size: 42px; font-weight: 800; color: #0f172a; margin-bottom: 10px;">الفيزياء</div>
        <div class="sub-title" style="font-size: 28px; font-weight: 600; color: #334155; margin-bottom: 20px;">الصف الثالث الثانوي</div>
        <div class="cover-frame" style="border: 3px solid #1a365d; border-radius: 16px; padding: 30px; margin: 20px 0; background: #f8fafc;">
            <h3 style="font-size: 30px; color: #1e293b;">📖 -الباب الأول- كراسة الحلول النموذجية 📖</h3>
            <h4 style="font-size: 22px; color: #475569; margin: 10px 0;"> -امتحان 2022-2023 أسئلة من امتحانات سابقة</h4>
            <div style="font-size: 20px; color: #64748b;">الكهربائية والمغناطيسية والذرية</div>
            <div style="font-size: 24px; font-weight: 700; color: #0f172a; margin-top: 15px;">العام الدراسي 2026 - 2027</div>
        </div>
        <div style="font-size: 22px; color: #059669; margin: 15px 0;">✨ إهداء إلى طلبتنا المتميزين ✨</div>
        <div style="font-size: 16px; color: #475569;">
            رابط البوت التعليمي:<br>
            <a href="http://t.me/amjad_africa2027bot" style="color: #2563eb; text-decoration: none;">t.me/amjad_africa2027bot</a>
        </div>
    `;
    printableDoc.appendChild(coverPage);

    // ==========================================
    // الصفحة 2: أوراق القوانين الفيزيائية (إن وجدت)
    // ==========================================
    if (typeof addPhysicsLawsPages === 'function') {
        addPhysicsLawsPages();
    }

    // ==========================================
    // الصفحة 3: ورقة بداية الأسئلة
    // ==========================================
    if (typeof addQuestionsStartPage === 'function') {
        addQuestionsStartPage();
    }

    // ==========================================
    // الصفحة 4 وما بعدها: محتوى الأسئلة
    // ==========================================
    const mainPage = document.createElement('div');
    mainPage.className = 'print-page-box';
    mainPage.style.cssText = `
        page-break-after: auto;
        break-after: auto;
        min-height: auto;
        height: auto;
        padding: 4mm 6mm 5mm 6mm;
    `;

    const pairContainer = document.createElement('div');
    pairContainer.className = 'pdf-questions-pair-container';
    pairContainer.style.cssText = `
        display: block;
        width: 100%;
    `;

    questionsMatrix.forEach((q, index) => {
        const questionNumber = index + 1;
        let fontSize = 14;

        // ===== استخراج الخيارات الرئيسية بشكل منسق وبدون تكرار خطوات الحل =====
        let optionsHtml = '';
        let optionsList = q.options || [];

        // في حال كانت الخيارات محتواة داخل نص السؤال العام وليس حقل منفصل
        let cleanQuestionText = q.text || '';
        if (optionsList.length === 0 && cleanQuestionText.includes('(أ)')) {
            const parts = cleanQuestionText.split(/\((?:أ\vert{}ب\vert{}ج\vert{}d\vert{}د)\)/);
            cleanQuestionText = parts[0].trim();
            const matches = q.text.match(/\((?:أ\vert{}ب\vert{}ج\vert{}د)\)\s*[^(\n]+/g);
            if (matches) {
                optionsList = matches.map(m => ({ text: m.replace(/\((?:أ\vert{}ب\vert{}ج\vert{}د)\)\s*/, '').trim() }));
            }
        }

        if (optionsList.length > 0) {
            optionsHtml += `<div class="pdf-options-container" style="display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; width: 100%; direction: rtl;">`;
            optionsList.forEach((opt, optIdx) => {
                const rawText = typeof opt === 'object' ? opt.text : opt;
                const formattedText = formatOptionText(rawText, optIdx);
                optionsHtml += `
                    <div class="pdf-option-item" style="flex: 0 0 calc(50% - 4px); max-width: calc(50% - 4px); box-sizing: border-box; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 8px; font-size: ${fontSize}px; text-align: right; direction: rtl;">
                        📌 <span dir="auto">${formattedText}</span>
                    </div>
                `;
            });
            optionsHtml += `</div>`;
        }

        // ===== خطوات الحل المفصلة =====
        let stepsHtml = '';
        if (q.pdfSolutionSteps && q.pdfSolutionSteps.length > 0) {
            q.pdfSolutionSteps.forEach(s => {
                if (s && s.trim()) {
                    stepsHtml += `<div style="padding: 2px 0; font-size: ${fontSize}px; line-height: 1.5;">${s}</div>`;
                }
            });
        }

        // ===== الرسم التوضيحي SVG أو صورة =====
        let graphicHtml = '';
        if (q.svgCode && q.svgCode.trim() !== "") {
            graphicHtml = `<div class="pdf-graphic" style="text-align: center; margin: 4px 0; padding: 4px;">${q.svgCode}</div>`;
        } else if (q.imagePath && q.imagePath.trim() !== "") {
            graphicHtml = `<div class="pdf-graphic" style="text-align: center; margin: 4px 0;"><img src="${q.imagePath}" alt="رسم توضيحي" style="max-width: 100%;"></div>`;
        }

        const questionDiv = document.createElement('div');
        questionDiv.className = 'pdf-question-block';
        questionDiv.style.cssText = `
            page-break-inside: avoid !important;
            break-inside: avoid !important;
            margin-bottom: 12px !important;
            padding-bottom: 8px !important;
            border-bottom: 1px dashed #cbd5e1;
            display: block;
            width: 100%;
        `;

        questionDiv.innerHTML = `
            <div class="pdf-q-title" style="font-size: ${fontSize + 2}px; font-weight: bold; color: #1a365d; margin-bottom: 3px;">${questionNumber}. ${q.title || ''}</div>
            <div class="pdf-q-text" style="font-size: ${fontSize + 1}px; line-height: 1.6; color: #2d3748; margin-bottom: 3px;">${cleanQuestionText}</div>
            ${graphicHtml}
            ${optionsHtml}
            <div class="pdf-solution-box" style="margin-top: 4px; padding-top: 4px; border-top: 1px dashed #edf2f7;">
                <div class="pdf-sol-steps" style="padding-right: 6px; color: #2d3748;">${stepsHtml || 'لا يوجد حل متاح'}</div>
                ${q.pdfFinalAnswer ? `<div class="pdf-final-ans" style="font-size: ${fontSize}px; font-weight: bold; margin-top: 4px; color: #065f46; padding: 2px 6px; background-color: #f0fdf4; border-radius: 4px; display: inline-block;">${q.pdfFinalAnswer}</div>` : ''}
            </div>
        `;

        pairContainer.appendChild(questionDiv);
    });

    mainPage.appendChild(pairContainer);

    // تذييل الصفحة الأخيرة
    const pageFooter = document.createElement('div');
    pageFooter.className = 'page-footer-number';
    pageFooter.style.cssText = `
        text-align: center;
        font-size: 11px;
        color: #666;
        border-top: 1px solid #ddd;
        padding-top: 5px;
        margin-top: 6px;
    `;
    pageFooter.innerHTML = `⚡ - هذه المذكرة خاصة بطلبة مدرسة أمجاد أفريقيا - ⚡`;
    mainPage.appendChild(pageFooter);

    currentQuestionsArea.appendChild(mainPage);
    printableDoc.appendChild(currentQuestionsArea);

    // الانتظار القصير لضمان تحضير المحتوى قبل فتح النافذة الخاصة بالطباعة
    setTimeout(() => {
        window.print();
    }, 400);
}

window.onload = () => {
        renderActiveQuestion(0);
    };

    document.addEventListener('DOMContentLoaded', function() {
        if (typeof renderMathInElement === 'function') {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '\\[', right: '\\]', display: true},
                    {left: '\\(', right: '\\)', display: false}
                ]
            });
        }
    });
</script>
</body>
</html>
